plugins { id 'com.android.application' }
android {
    namespace 'de.archterminal'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'de.archterminal'
        minSdk 28
        // Required for execve() of pacman-installed ELF files in private storage.
        targetSdk 28
        versionCode 10
        versionName '0.1.9'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'de.archterminal.TerminalInstrumentation'
    }
    sourceSets {
        main { jniLibs.srcDirs = ["$buildDir/generated/jniLibs"]; assets.srcDirs += ["$buildDir/generated/assets"] }
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libproot*.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { disable 'ExpiredTargetSdkVersion', 'OldTargetApi' }
}
dependencies { implementation project(':terminal-view'); testImplementation 'junit:junit:4.13.2' }
tasks.register('prepareRuntime', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'scripts/build-native.sh'
}
tasks.named('preBuild').configure { dependsOn 'prepareRuntime' }

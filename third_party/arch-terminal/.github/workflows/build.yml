name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rootfs_smoke:
        description: Download and verify the Arch ARM64 image, then run the host PRoot smoke test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libarchive-dev libarchive-tools gnupg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .cache/sources
          key: android-${{ runner.os }}-${{ hashFiles('scripts/dependencies.lock.json', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Pinned Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Native and Java tests, Android lint
        run: scripts/test.sh
      - name: Build and verify APKs
        run: scripts/build.sh
      - name: Verify real Arch ARM64 rootfs
        if: inputs.rootfs_smoke
        run: scripts/test-rootfs.sh
      - name: Package corresponding sources
        run: scripts/source-bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArchTerminal-arm64
          path: |
            output/
            app/build/reports/
            third_party/termux/emulator/build/reports/tests/
          if-no-files-found: error

pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'ArchTerminal'
include ':app', ':terminal-emulator', ':terminal-view'
project(':terminal-emulator').projectDir = file('third_party/termux/emulator')
project(':terminal-view').projectDir = file('third_party/termux/view')

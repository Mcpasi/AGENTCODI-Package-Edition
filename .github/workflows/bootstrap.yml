# Preserve the reusable APK dependency, replacing the former APT bootstrap.
name: Arch Terminal runtime
on:
  workflow_call:
    inputs:
      rootfs_smoke:
        description: 'Download and test the pinned Arch rootfs (about 791 MiB)'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      rootfs_smoke:
        description: 'Download and test the pinned Arch rootfs (about 791 MiB)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    name: Build pinned Arch Terminal ARM64 runtime
    # TODO: Nach Abschluss der Integration nur refs/heads/main zulassen.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Mcpasi/Fusion_Arch_Termux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify unchanged upstream sources and integration tests
        run: python3 -B .github/ci/test-arch-terminal.py
      - name: Install the pinned NDK for upstream native builds
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build upstream runtime in an isolated source copy
        run: bash scripts/arch-terminal/build-runtime.sh
      - name: Test the actual Arch guest when requested
        if: inputs.rootfs_smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools gnupg
          bash scripts/arch-terminal/test-upstream.sh --rootfs
      - name: Bundle complete combined application sources
        run: python3 -B scripts/arch-terminal/source-bundle.py
      - name: Upload runtime, license files and corresponding sources
        uses: actions/upload-artifact@v4
        with:
          name: agentcodi-arch-terminal
          path: output/arch-terminal/
          if-no-files-found: error

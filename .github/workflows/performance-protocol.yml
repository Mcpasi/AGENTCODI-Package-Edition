name: Protocol performance reproduction

on:
  push:
    paths:
      - 'modules/core/src/main/java/**'
      - 'tests/performance/**'
      - '.github/ci/*performance*'
      - '.github/workflows/performance-protocol.yml'
  pull_request:
    paths:
      - 'modules/core/src/main/java/**'
      - 'tests/performance/**'
      - '.github/ci/*performance*'
      - '.github/workflows/performance-protocol.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Record an additional JFR replay for hotspot inspection
        type: boolean
        default: false
      fail_on_findings:
        description: Fail on diagnostic performance signals (default is report-only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      PROFILE: ${{ inputs.profile || false }}
      FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check measurement aggregation
        run: python3 -B .github/ci/test-performance-report.py
      - name: Replay escaped and large incoming history JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          options=()
          if [ "$PROFILE" = true ]; then options+=(--profile); fi
          if [ "$FAIL_ON_FINDINGS" = true ]; then options+=(--fail-on-findings); fi
          python3 -B .github/ci/run-performance-benchmarks.py \
            --suite protocol --output "$RUNNER_TEMP/performance-protocol" "${options[@]}"
      - name: Upload measurements and optional JFR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-protocol-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-protocol/
          if-no-files-found: error
          retention-days: 30
